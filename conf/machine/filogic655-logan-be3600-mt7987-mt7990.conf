#@TYPE: Machine
#@NAME: mediatek filogic
#@NEEDED_BSPLAYERS: meta-filogic
#@DESCRIPTION: Machine configuration for running a RDK broadband on mediatek filogic
#@RDK_FLAVOR: rdkb

include conf/machine/filogic.conf

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

MACHINE_IMAGE_NAME = "rdkb-generic-broadband-image"

MACHINEOVERRIDES .= ":broadband:filogic:mt7987:mt7993:mt7993-be3600"

PREFERRED_PROVIDER_u-boot-fw-utils = "libubootenv"

PREFERRED_VERSION_xfsprogs = "4.8.0"
PREFERRED_VERSION_php_dunfell = "7.1.%"
PREFERRED_VERSION_php-native_dunfell = "7.1.%"

PREFERRED_PROVIDER_virtual/kernel = "linux-mediatek"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
PREFERRED_VERSION_linux-mediatek = "5.4.%"
PREFERRED_VERSION_linux-libc-headers = "5.4"

PREFERRED_PROVIDER_hal-wifi = "hal-wifi-logan"
PREFERRED_VERSION_iw_filogic = "5.%"
#PREFERRED_PROVIDER_hal-wifi = "hal-wifi-mt76"
#PREFERRED_VERSION_iw_filogic = "6.%"
#PREFERRED_VERSION_lua = "5.3.%"

#wifi bsp from openwrt - logan
PREFERRED_VERSION_hostapd = "2.10"
PREFERRED_VERSION_wpa-supplicant = "2.10"

#wifi bsp from openwrt - mt76
PREFERRED_VERSION_linux-mac80211 = "6.%"
#PREFERRED_VERSION_linux-mt76 = "3.%"
#PREFERRED_VERSION_hostapd = "2.11"
#PREFERRED_VERSION_wpa-supplicant_filogic = "2.11"
#PREFERRED_VERSION_json-c = "0.15"
#PREFERRED_VERSION_linux-mac80211 = "5.15.%"
#PREFERRED_VERSION_linux-mt76 = "2.%"

#masking files for dunfell build
require conf/include/filogic-bbmasks.inc
#require conf/include/rdk-external-src-platform.inc

DISTRO_FEATURES:append = " meshwifi"
DISTRO_FEATURES:append = " ipv6"
DISTRO_FEATURES:append = " kernel_in_ubi"
#DISTRO_FEATURES:append = " switch_gsw_mode"
DISTRO_FEATURES:append = " fwupgrade_manager"
#DISTRO_FEATURES:append = " mt76"
#DISTRO_FEATURES:append = " flow_offload"
#DISTRO_FEATURES:append = " wifi_eht"
DISTRO_FEATURES:append = " logan"
#DISTRO_FEATURES:append = " mtk_easymesh"
# kernel 5.4 gold linker 'arm-rdk-linux-gnueabi-ld' not supported
#DISTRO_FEATURES:append = " referencepltfm "
#DISTRO_FEATURES:remove = " ld-is-gold"
DISTRO_FEATURES:append = " scnrdo"

BBMASK .= "|meta-filogic/recipes-wifi/"
BBMASK .= "|meta-filogic-logan/recipes-mtk-mesh/1905daemon"
BBMASK .= "|meta-filogic-logan/recipes-mtk-mesh/libmapd"
BBMASK .= "|meta-filogic-logan/recipes-mtk-mesh/libwpactrl"
BBMASK .= "|meta-filogic-logan/recipes-mtk-mesh/mapd"
BBMASK .= "|meta-filogic-logan/recipes-mtk-mesh/mapfilter"
BBMASK .= "|meta-filogic-logan/recipes-mtk-mesh/wappd"
BBMASK .= "|meta-filogic-logan/recipes-netsys/"

DISTRO_FEATURES:append = " emmc"
DISTRO_FEATURES:append = " mt7987"
#select logan config
#for mt7993-be3600
DISTRO_FEATURES:append = " mt7993-be3600"
MACHINEOVERRIDES .="${@bb.utils.contains('DISTRO_FEATURES','mt7993-be3600',':mt7993-be3600','',d)}"

#for sdk support
INHERIT:append = " uninative"
BB_SETSCENE_ENFORCE_IGNORE_TASKS:append = " %:* *:do_fetch *"

BOOT_SUFFIX = "bin"
MACHINE_FEATURES = "ext2 ipsec nfs pci smbfs usbgadget usbhost vfat"

#for secure boot support
#DISTRO_FEATURES:append = " secure_boot"
MACHINEOVERRIDES .="${@bb.utils.contains('DISTRO_FEATURES','secure_boot',':secureboot','',d)}"
SECURE_BOOT_KEYNAME_secureboot = "fit_key"
SECURE_BOOT_KEYDIR_secureboot = "${TOPDIR}/../keys"
FIT_HASH_ALG_secureboot ="sha1"
HASHED_BOOT_DEVICE_secureboot = "252:0"
