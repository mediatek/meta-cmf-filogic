#@TYPE: Machine
#@NAME: mediatek filogic
#@NEEDED_BSPLAYERS: meta-filogic
#@DESCRIPTION: Machine configuration for running a RDK broadband on mediatek filogic
#@RDK_FLAVOR: rdkb

include conf/machine/filogic.conf
include conf/machine/filogic880-logan.conf

PREFERRED_VERSION_iproute2 = "6.7.0"

DISTRO_FEATURES:append = " ccn34"
DISTRO_FEATURES:append = " eagle"
DISTRO_FEATURES:append = " scnrdo"
DISTRO_FEATURES:remove = " meshwifi"
DISTRO_FEATURES:remove = " mtk_easymesh"
DISTRO_FEATURES:append = " switch_gsw_mode"
DISTRO_FEATURES:append = " eip-197-inline"
DISTRO_FEATURES:append = " capwap-dtls"
